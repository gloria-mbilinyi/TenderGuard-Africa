name: Deployment verification

on:
  push:
    branches: [nairobi-demo-prep]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-integration:
    # Standard public-repository runners are free. Never select a paid larger runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TENDERGUARD_DOMAIN: validation.tenderguard.test
      TENDERGUARD_TLS_EMAIL: operator@example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Create ephemeral masked test configuration
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          values = {
              'TENDERGUARD_API_KEY': secrets.token_hex(32),
              'TENDERGUARD_DASHBOARD_PASSWORD': secrets.token_hex(24),
              'TG_VERIFY_PROJECT': 'tg-verify-' + secrets.token_hex(6),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              for key, value in values.items():
                  if key != 'TG_VERIFY_PROJECT':
                      print('::add-mask::' + value)
                  target.write(key + '=' + value + '\n')
          PY
      - name: Install test dependencies and verify frontend
        run: |
          python -m pip install -e '.[dev]'
          npm --prefix frontend ci
          npm --prefix frontend run test
          npm --prefix frontend run build
          python -m ruff check app mcp_servers tests scripts examples deploy
          bash -n deploy/aws/bootstrap_ubuntu.sh
          git diff --check
      - name: Validate production Compose and Caddy configuration
        run: |
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml config --quiet
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Build and start isolated validation containers
        run: |
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml -f deploy/validation/compose.validation.yaml build
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml -f deploy/validation/compose.validation.yaml up -d --wait --wait-timeout 120 ollama
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml -f deploy/validation/compose.validation.yaml exec -T ollama ollama pull qwen3:1.7b
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml -f deploy/validation/compose.validation.yaml up -d --wait --wait-timeout 180
          for attempt in $(seq 1 30); do
            if docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml -f deploy/validation/compose.validation.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/tenderguard-test-ca.crt"; then break; fi
            sleep 1
          done
      - name: Run backend and real TLS PDF model persistence integration tests
        env:
          TENDERGUARD_OLLAMA_URL: http://127.0.0.1:11434/api/chat
        run: |
          python -m pytest -q
          python -m deploy.validation.smoke --project "$TG_VERIFY_PROJECT" --ca-file "$RUNNER_TEMP/tenderguard-test-ca.crt"
      - name: Remove only the isolated verification project
        if: always() && env.TG_VERIFY_PROJECT != ''
        run: |
          case "$TG_VERIFY_PROJECT" in tg-verify-*) ;; *) exit 2 ;; esac
          docker compose -p "$TG_VERIFY_PROJECT" -f deploy/aws/compose.aws.yaml -f deploy/validation/compose.validation.yaml down --volumes --remove-orphans

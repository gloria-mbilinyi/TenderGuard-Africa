name: tenderguard-africa-aws

x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      TENDERGUARD_DOMAIN: "${TENDERGUARD_DOMAIN:?Set a public DNS name for HTTPS}"
      TENDERGUARD_TLS_EMAIL: "${TENDERGUARD_TLS_EMAIL:?Set the TLS notification email}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  tenderguard:
    image: tenderguard-africa:0.4.0
    build:
      context: ../..
      args:
        PYTHON_VERSION: "3.12.16"
        NODE_VERSION: "24.22.1"
        FILESYSTEM_MCP_VERSION: "2.3.0"
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      TENDERGUARD_API_KEY: "${TENDERGUARD_API_KEY:?Generate a private 32+ character API key}"
      TENDERGUARD_DASHBOARD_PASSWORD: "${TENDERGUARD_DASHBOARD_PASSWORD:?Set a private 12+ character dashboard password}"
      TENDERGUARD_COOKIE_SECURE: "true"
      TENDERGUARD_ALLOWED_ORIGINS: "https://${TENDERGUARD_DOMAIN:?Set a public DNS name for HTTPS}"
      TENDERGUARD_DOCUMENT_STORAGE: /app/storage/document_evaluations
      TENDERGUARD_MAX_PDF_MB: "${TENDERGUARD_MAX_PDF_MB:-10}"
      TENDERGUARD_MAX_PDF_PAGES: "${TENDERGUARD_MAX_PDF_PAGES:-80}"
      TENDERGUARD_OLLAMA_URL: http://ollama:11434/api/chat
      TENDERGUARD_OLLAMA_MODEL: "${TENDERGUARD_OLLAMA_MODEL:-qwen3:1.7b}"
      TENDERGUARD_FILESYSTEM_MCP_COMMAND: /opt/filesystem-mcp/node_modules/.bin/mcp-server-filesystem
    expose:
      - "8000"
    volumes:
      - tenderguard_reports:/app/reports
      - tenderguard_documents:/app/storage
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.14
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - private
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  edge:
  private:
    internal: false

volumes:
  caddy_data:
  caddy_config:
  tenderguard_reports:
  tenderguard_documents:
  ollama_models:
